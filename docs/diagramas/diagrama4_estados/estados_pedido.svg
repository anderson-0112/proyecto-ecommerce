<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 480" width="1680" height="480" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2a36"/></marker>
<marker id="m-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a3f6e"/></marker>
<marker id="m-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f7d4f"/></marker>
<marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5a00"/></marker>
<marker id="m-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b8a"/></marker>
<marker id="m-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6673"/></marker>
</defs>
<rect width="1680" height="480" fill="#ffffff"/>
<text x="20" y="34" font-size="20" font-weight="bold" fill="#1f2a36" text-anchor="start">Estados del pedido (campo pedidos.estado)</text>
<text x="20" y="56" font-size="12" font-weight="normal" fill="#5b6673" text-anchor="start">Quién provoca cada transición y qué ocurre en cada estado, según la implementación de pedidos-service.</text>
<rect x="220" y="180" width="150" height="56" rx="10" fill="#eef1f4" stroke="#3a4a5c" stroke-width="2"/>
<text x="295.0" y="214" font-size="15" font-weight="bold" fill="#1f2a36" text-anchor="middle">Pendiente</text>
<rect x="520" y="180" width="150" height="56" rx="10" fill="#eef1f4" stroke="#3a4a5c" stroke-width="2"/>
<text x="595.0" y="214" font-size="15" font-weight="bold" fill="#1f2a36" text-anchor="middle">Pagado</text>
<rect x="820" y="180" width="150" height="56" rx="10" fill="#eef1f4" stroke="#3a4a5c" stroke-width="2"/>
<text x="895.0" y="214" font-size="15" font-weight="bold" fill="#1f2a36" text-anchor="middle">Preparando</text>
<rect x="1120" y="180" width="150" height="56" rx="10" fill="#eef1f4" stroke="#3a4a5c" stroke-width="2"/>
<text x="1195.0" y="214" font-size="15" font-weight="bold" fill="#1f2a36" text-anchor="middle">Enviado</text>
<rect x="1420" y="180" width="150" height="56" rx="10" fill="#eef1f4" stroke="#3a4a5c" stroke-width="2"/>
<text x="1495.0" y="214" font-size="15" font-weight="bold" fill="#1f2a36" text-anchor="middle">Entregado</text>
<circle cx="60" cy="208.0" r="11" fill="#1f2a36"/>
<polyline points="71,208.0 220,208.0" fill="none" stroke="#1f2a36" stroke-width="1.8" marker-end="url(#m-ink)"/>
<text x="140" y="178.0" font-size="11" font-weight="bold" fill="#1f2a36" text-anchor="middle">Cliente crea el pedido</text>
<text x="140" y="193.0" font-size="11" font-weight="normal" fill="#5b6673" text-anchor="middle">POST /api/pedidos</text>
<polyline points="1570,208.0 1614,208.0" fill="none" stroke="#1f2a36" stroke-width="1.8" marker-end="url(#m-ink)"/>
<circle cx="1630" cy="208.0" r="13" fill="#ffffff" stroke="#1f2a36" stroke-width="2"/>
<circle cx="1630" cy="208.0" r="7" fill="#1f2a36"/>
<path d="M255,180 C255,110 335,110 335,178" fill="none" stroke="#b03a2e" stroke-width="2"/>
<path d="M329,168 L335,179 L341,168 z" fill="#b03a2e"/>
<text x="295" y="104" font-size="11" font-weight="bold" fill="#b03a2e" text-anchor="middle">Pago rechazado o PayPal no aprobado</text>
<text x="295" y="119" font-size="11" font-weight="normal" fill="#b03a2e" text-anchor="middle">(el pedido sigue pendiente)</text>
<polyline points="370,208.0 520,208.0" fill="none" stroke="#7a3f6e" stroke-width="2.2" marker-end="url(#m-purple)"/>
<text x="445.0" y="196.0" font-size="11" font-weight="bold" fill="#7a3f6e" text-anchor="middle">Pago confirmado</text>
<text x="445.0" y="230.0" font-size="11" font-weight="normal" fill="#7a3f6e" text-anchor="middle">(lo asigna el sistema)</text>
<polyline points="670,208.0 820,208.0" fill="none" stroke="#2f6b8a" stroke-width="2.2" marker-end="url(#m-blue)"/>
<text x="745.0" y="196.0" font-size="11" font-weight="bold" fill="#2f6b8a" text-anchor="middle">Administrador</text>
<text x="745.0" y="230.0" font-size="11" font-weight="normal" fill="#2f6b8a" text-anchor="middle">(siguiente estado)</text>
<polyline points="970,208.0 1120,208.0" fill="none" stroke="#2f6b8a" stroke-width="2.2" marker-end="url(#m-blue)"/>
<text x="1045.0" y="196.0" font-size="11" font-weight="bold" fill="#2f6b8a" text-anchor="middle">Administrador</text>
<text x="1045.0" y="230.0" font-size="11" font-weight="normal" fill="#2f6b8a" text-anchor="middle">(siguiente estado)</text>
<polyline points="1270,208.0 1420,208.0" fill="none" stroke="#2f6b8a" stroke-width="2.2" marker-end="url(#m-blue)"/>
<text x="1345.0" y="196.0" font-size="11" font-weight="bold" fill="#2f6b8a" text-anchor="middle">Administrador</text>
<text x="1345.0" y="230.0" font-size="11" font-weight="normal" fill="#2f6b8a" text-anchor="middle">(siguiente estado)</text>
<polyline points="295.0,236 295.0,292" fill="none" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="7 5"/>
<rect x="150" y="292" width="290" height="94" rx="6" fill="#fdf9f1" stroke="#8a5a00" stroke-width="1.5"/>
<text x="160" y="313" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">Pendiente: el pedido se registró con el stock</text>
<text x="160" y="329" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">verificado, pero todavía no se ha cobrado.</text>
<text x="160" y="345" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">Si Stripe rechaza el pago o el cliente no lo</text>
<text x="160" y="361" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">aprueba en PayPal, el pedido sigue pendiente y</text>
<text x="160" y="377" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">el cliente puede reintentar el pago.</text>
<polyline points="595.0,236 595.0,292" fill="none" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="7 5"/>
<rect x="455" y="292" width="300" height="94" rx="6" fill="#fdf9f1" stroke="#8a5a00" stroke-width="1.5"/>
<text x="465" y="313" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">Pagado: lo asigna solo el sistema, cuando</text>
<text x="465" y="329" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">pagos-service llama a la ruta interna</text>
<text x="465" y="345" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">PUT /api/pedidos/interno/{id}/pagado.</text>
<text x="465" y="361" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">En ese momento se descuenta el stock, se</text>
<text x="465" y="377" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">genera el QR y se envía el correo.</text>
<rect x="790" y="292" width="830" height="62" rx="6" fill="#fdf9f1" stroke="#8a5a00" stroke-width="1.5"/>
<text x="800" y="313" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">Preparando, Enviado y Entregado: los asigna el administrador con PUT /api/pedidos/{id}/estado, y solo</text>
<text x="800" y="329" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">puede avanzar al estado siguiente. Cualquier otro cambio (saltar o retroceder un estado, o asignar «pagado»</text>
<text x="800" y="345" font-size="11" font-weight="normal" fill="#1f2a36" text-anchor="start">manualmente) responde 409 Conflict. El modelo no incluye un estado «cancelado».</text>
<polyline points="895.0,236 895.0,292" fill="none" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="7 5"/>
<polyline points="1195.0,236 1195.0,292" fill="none" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="7 5"/>
<polyline points="1495.0,236 1495.0,292" fill="none" stroke="#5b6673" stroke-width="1.3" stroke-dasharray="7 5"/>
<rect x="20" y="418" width="1640" height="44" rx="8" fill="#f6f8fa" stroke="#e1e6eb" stroke-width="1"/>
<text x="36" y="445" font-size="12.5" font-weight="bold" fill="#1f2a36" text-anchor="start">Leyenda</text>
<polyline points="130,440 174,440" fill="none" stroke="#1f2a36" stroke-width="2.2" marker-end="url(#m-ink)"/>
<text x="184" y="444" font-size="11.5" font-weight="normal" fill="#1f2a36" text-anchor="start">Acción del cliente</text>
<polyline points="510,440 554,440" fill="none" stroke="#7a3f6e" stroke-width="2.2" marker-end="url(#m-purple)"/>
<text x="564" y="444" font-size="11.5" font-weight="normal" fill="#1f2a36" text-anchor="start">Transición que asigna el sistema</text>
<polyline points="890,440 934,440" fill="none" stroke="#2f6b8a" stroke-width="2.2" marker-end="url(#m-blue)"/>
<text x="944" y="444" font-size="11.5" font-weight="normal" fill="#1f2a36" text-anchor="start">Transición que asigna el administrador</text>
<polyline points="1270,440 1314,440" fill="none" stroke="#b03a2e" stroke-width="2.2"/>
<text x="1324" y="444" font-size="11.5" font-weight="normal" fill="#1f2a36" text-anchor="start">Pago no completado (el estado no cambia)</text>
</svg>