# =============================================================
# Plataforma E-Commerce Distribuida — orquestación local
# Uso:  docker compose up --build -d
# Un contenedor por servicio; todos en la red interna "ecommerce".
# Solo el Gateway publica un puerto (80): es la única entrada, en local y en el VPS.
# URLs entre servicios y datos de conexión: variables de entorno con los valores
# de Docker por defecto (${VAR:-valor}); se pueden cambiar en el .env sin tocar este archivo.
# =============================================================

services:

  # ---------- API Gateway (punto único de entrada) ----------
  gateway:
    image: nginx:1.27-alpine
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - catalogo-service
      - pedidos-service
      - pagos-service
    networks: [ecommerce]
    restart: unless-stopped

  # ---------- Microservicios PHP 8 (Apache) ----------
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      DB_HOST: ${DB_HOST:-mariadb-master}
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mariadb-master:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ecommerce]
    # Si un contenedor está detenido, su nombre deja de resolverse: se falla en 1 s, no en 8
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped

  catalogo-service:
    build: ./catalogo-service
    container_name: catalogo-service
    environment:
      DB_HOST: ${DB_HOST:-mariadb-master}            # escrituras (admin)
      DB_READ_HOST: ${DB_READ_HOST:-mariadb-slave}   # lecturas del catálogo -> Slave
      DB_NAME: catalogo_db
      DB_USER: catalogo_user
      DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8081}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      mariadb-master:
        condition: service_healthy
      mariadb-slave:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [ecommerce]
    # Si un contenedor está detenido, su nombre deja de resolverse: se falla en 1 s, no en 8
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped

  pedidos-service:
    build: ./pedidos-service
    container_name: pedidos-service
    environment:
      DB_HOST: ${DB_HOST:-mariadb-master}
      DB_READ_HOST: ${DB_READ_HOST:-mariadb-slave}   # reportes del admin -> Slave
      DB_NAME: pedidos_db
      DB_USER: pedidos_user
      DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8081}
      CATALOGO_URL: ${CATALOGO_URL:-http://catalogo-service:8082}
      PAGOS_URL: ${PAGOS_URL:-http://pagos-service:8084}
      APP_URL: ${APP_URL:-http://localhost}
    depends_on:
      mariadb-master:
        condition: service_healthy
    networks: [ecommerce]
    # Si un contenedor está detenido, su nombre deja de resolverse: se falla en 1 s, no en 8
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped

  pagos-service:
    build: ./pagos-service
    container_name: pagos-service
    environment:
      DB_HOST: ${DB_HOST:-mariadb-master}
      DB_NAME: pagos_db
      DB_USER: pagos_user
      DB_PASSWORD: ${PAGOS_DB_PASSWORD}
      AUTH_URL: ${AUTH_URL:-http://auth-service:8081}
      PEDIDOS_URL: ${PEDIDOS_URL:-http://pedidos-service:8083}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-http://notificaciones-service:8085}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      mariadb-master:
        condition: service_healthy
    networks: [ecommerce]
    # Si un contenedor está detenido, su nombre deja de resolverse: se falla en 1 s, no en 8
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped

  notificaciones-service:
    build: ./notificaciones-service
    container_name: notificaciones-service
    environment:
      AUTH_URL: ${AUTH_URL:-http://auth-service:8081}
    networks: [ecommerce]
    # Si un contenedor está detenido, su nombre deja de resolverse: se falla en 1 s, no en 8
    dns_opt: ["timeout:1", "attempts:1"]
    restart: unless-stopped

  # ---------- Base de datos ----------
  mariadb-master:
    image: mariadb:10.6
    container_name: mariadb-master
    # Master: registra cada escritura en el binlog (log binario) para que el Slave la copie
    command: ["--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      # Usuario con permiso REPLICATION REPLICA que usa el Slave para leer el binlog
      MARIADB_REPLICATION_USER: replicador
      MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      # Los usa db/crear-usuarios.sh para crear un usuario por servicio
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CATALOGO_DB_PASSWORD: ${CATALOGO_DB_PASSWORD}
      PEDIDOS_DB_PASSWORD: ${PEDIDOS_DB_PASSWORD}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD}
    # Sin puerto publicado al host: solo los servicios acceden por la red interna.
    # Para inspeccionar: docker exec -it mariadb-master mariadb -uroot -p
    volumes:
      - master-data:/var/lib/mysql
      # Se ejecutan en orden alfabético solo la PRIMERA vez (volumen vacío)
      - ./db/init-master.sql:/docker-entrypoint-initdb.d/01-init-master.sql:ro
      - ./db/crear-usuarios.sh:/docker-entrypoint-initdb.d/02-crear-usuarios.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ecommerce]
    restart: unless-stopped

  # Slave (réplica de solo lectura). Al iniciar ejecuta CHANGE MASTER TO ... y copia
  # desde el binlog del Master TODO lo ocurrido desde su creación (esquema, datos y
  # usuarios de servicio incluidos), luego sigue replicando cada cambio en tiempo real.
  mariadb-slave:
    image: mariadb:10.6
    container_name: mariadb-slave
    command: ["--server-id=2", "--read-only=1", "--relay-log=relay-bin"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_MASTER_HOST: ${DB_HOST:-mariadb-master}
      MARIADB_REPLICATION_USER: replicador
      MARIADB_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - slave-data:/var/lib/mysql
    depends_on:
      mariadb-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [ecommerce]
    restart: unless-stopped

  # ---------- Redis: caché del catálogo y tokens JWT revocados ----------
  redis:
    image: redis:7-alpine
    container_name: redis
    # appendonly: guarda en disco, así los tokens revocados sobreviven a un reinicio
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [ecommerce]
    restart: unless-stopped

networks:
  ecommerce:
    name: ecommerce

volumes:
  master-data:
  slave-data:
  redis-data:
