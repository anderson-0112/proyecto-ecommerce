# =============================================================
# API Gateway — punto único de entrada a la plataforma
#  /            -> frontend estático (tienda + admin)
#  /api/auth/*  -> auth-service:8081
#  /api/catalogo/* -> catalogo-service:8082
#  /api/pedidos*   -> pedidos-service:8083
#  /api/pagos/*    -> pagos-service:8084
# Las rutas internas (/api/*/interno/* y /api/auth/verify) NO se
# exponen: solo se usan entre servicios por la red interna de Docker.
# =============================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    log_format main '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # DNS interno de Docker. Al usar variables en proxy_pass, Nginx resuelve
    # el nombre del servicio en cada petición: si un servicio está caído,
    # el Gateway sigue arrancando y atendiendo al resto (tolerancia a fallos).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout    60s;

        # Si el servicio de destino no responde, se devuelve JSON 503
        proxy_intercept_errors off;
        error_page 502 504 = @no_disponible;
        location @no_disponible {
            default_type application/json;
            return 503 '{"error":"Servicio no disponible temporalmente"}';
        }

        # ---------- Rutas internas bloqueadas desde fuera ----------
        location = /api/auth/verify {
            default_type application/json;
            return 403 '{"error":"Ruta interna: solo accesible entre servicios"}';
        }
        location ~ ^/api/[a-z]+/interno(/|$) {
            default_type application/json;
            return 403 '{"error":"Ruta interna: solo accesible entre servicios"}';
        }

        # ---------- Microservicios ----------
        location /api/auth/ {
            set $destino auth-service:8081;
            proxy_pass http://$destino;
        }
        location /api/catalogo/ {
            set $destino catalogo-service:8082;
            proxy_pass http://$destino;
        }
        location /api/pedidos {
            set $destino pedidos-service:8083;
            proxy_pass http://$destino;
        }
        location /api/pagos/ {
            set $destino pagos-service:8084;
            proxy_pass http://$destino;
        }

        location /api/ {
            default_type application/json;
            return 404 '{"error":"Ruta no encontrada"}';
        }

        # ---------- Frontend estático ----------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
