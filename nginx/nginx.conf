# =============================================================
# API Gateway — punto único de entrada a la plataforma (HTTP)
# Se usa en local (Docker Desktop) y en el VPS mientras se obtiene
# el certificado de Let's Encrypt. Con certificado: nginx-https.conf
# (se elige con NGINX_CONF en el .env).
# Las rutas están en rutas.conf (compartidas por ambas configuraciones).
# =============================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;

    log_format main '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # DNS interno de Docker. Al usar variables en proxy_pass, Nginx resuelve
    # el nombre del servicio en cada petición: si un servicio está caído,
    # el Gateway sigue arrancando y atendiendo al resto (tolerancia a fallos).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Reto HTTP-01 de Let's Encrypt (certbot escribe aquí el archivo de verificación)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/rutas.conf;
    }
}
