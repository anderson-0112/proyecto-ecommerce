# =============================================================
# API Gateway — producción con HTTPS (VPS de Hostinger, nodotec.tech)
# Se activa con NGINX_CONF=nginx-https.conf en el .env del servidor,
# después de obtener el certificado de Let's Encrypt (ver README).
#  - Puerto 80: solo el reto de Let's Encrypt y redirección 301 a HTTPS.
#  - Puerto 443: TLS (certificado en ./certbot/conf) + las mismas rutas.
# =============================================================
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 10m;
    server_tokens off;

    log_format main '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # DNS interno de Docker (ver nginx.conf): tolerancia a servicios caídos
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- HTTP: reto de Let's Encrypt y redirección ----------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://nodotec.tech$request_uri;
        }
    }

    # ---------- HTTPS: www -> dominio principal ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name www.nodotec.tech;
        ssl_certificate     /etc/letsencrypt/live/nodotec.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nodotec.tech/privkey.pem;
        return 301 https://nodotec.tech$request_uri;
    }

    # ---------- HTTPS: la tienda ----------
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name nodotec.tech;

        ssl_certificate     /etc/letsencrypt/live/nodotec.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/nodotec.tech/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        include /etc/nginx/rutas.conf;
    }
}
