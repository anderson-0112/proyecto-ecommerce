<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodoTec — Tienda de Electrónica y Tecnología</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/nodotec.css" rel="stylesheet">
</head>
<body>
<header id="cabecera"></header>

<main>
  <section class="hero py-5">
    <div class="container py-lg-4">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <h1 class="display-5 fw-bold">Tecnología que te conecta</h1>
          <p class="lead mb-4">Smartphones, laptops, audio, consolas y más, con pago seguro y seguimiento de tu pedido.</p>
          <a href="#catalogo" class="btn btn-warning btn-lg">Ver catálogo</a>
        </div>
        <div class="col-lg-5 d-none d-lg-block text-center">
          <i class="bi bi-laptop" style="font-size: 9rem; opacity: .85"></i>
        </div>
      </div>
    </div>
  </section>

  <section class="container py-5">
    <h2 class="h4 mb-3"><i class="bi bi-star-fill text-warning"></i> Destacados</h2>
    <div id="destacados" class="row g-3"></div>
  </section>

  <section id="catalogo" class="container pb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
      <h2 class="h4 mb-0">Catálogo</h2>
      <form id="filtros" class="d-flex flex-wrap gap-2">
        <select id="filtroCategoria" class="form-select form-select-sm" style="width:auto" aria-label="Categoría">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filtroPrecio" class="form-select form-select-sm" style="width:auto" aria-label="Precio máximo">
          <option value="">Cualquier precio</option>
          <option value="100">Hasta US$ 100</option>
          <option value="300">Hasta US$ 300</option>
          <option value="500">Hasta US$ 500</option>
          <option value="1000">Hasta US$ 1,000</option>
        </select>
      </form>
    </div>
    <div id="productos" class="row g-3"></div>
    <nav class="mt-4" aria-label="Páginas del catálogo"><ul id="paginacion" class="pagination justify-content-center"></ul></nav>
  </section>
</main>

<!-- Detalle de producto -->
<div class="modal fade" id="modalProducto" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content" id="contenidoProducto"></div>
  </div>
</div>

<footer id="pie"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/tienda.js"></script>
</body>
</html>
