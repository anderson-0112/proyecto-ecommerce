<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodoTec — Mis pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/nodotec.css" rel="stylesheet">
</head>
<body>
<header id="cabecera"></header>

<main class="container py-4">
  <h1 class="h4 mb-3">Mis pedidos</h1>
  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>#</th><th>Fecha</th><th>Estado</th><th class="text-end">Total</th><th></th></tr></thead>
        <tbody id="filas"><tr><td colspan="5" class="text-muted">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<footer id="pie"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!leerSesion()) { location.href = '/login.html?volver=/mis-pedidos.html'; return; }
  const { codigo, datos } = await api('GET', '/api/pedidos'); // historial del cliente (pedidos-service)
  const filas = document.getElementById('filas');
  if (codigo === 401) { location.href = '/login.html?volver=/mis-pedidos.html'; return; }
  if (codigo !== 200) { filas.innerHTML = '<tr><td colspan="5" class="text-danger">No se pudo cargar el historial.</td></tr>'; return; }
  filas.innerHTML = datos.pedidos.length === 0
    ? '<tr><td colspan="5" class="text-muted">Aún no tienes pedidos.</td></tr>'
    : datos.pedidos.map(p => `
      <tr>
        <td>${p.id}</td><td>${fechaLocal(p.fecha)}</td><td>${etiquetaEstado(p.estado)}</td>
        <td class="text-end">${moneda(p.total)}</td>
        <td class="text-end"><a class="btn btn-sm btn-outline-primary" href="/seguimiento.html?pedido=${p.id}">Ver</a></td>
      </tr>`).join('');
});
</script>
</body>
</html>
