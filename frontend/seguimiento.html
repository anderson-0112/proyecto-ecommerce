<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodoTec — Seguimiento de pedido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/nodotec.css" rel="stylesheet">
</head>
<body>
<header id="cabecera"></header>

<main class="container py-4" style="max-width: 900px">
  <div id="contenido"><p class="text-muted">Cargando…</p></div>
</main>

<footer id="pie"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
// Página a la que lleva el código QR: /seguimiento.html?pedido=ID
// Solo el dueño del pedido (o un admin) puede verlo (D16), por eso pide iniciar sesión.
const ICONOS = { pendiente: 'hourglass', pagado: 'credit-card', preparando: 'box-seam', enviado: 'truck', entregado: 'house-check' };

document.addEventListener('DOMContentLoaded', async () => {
  const id = parseInt(new URLSearchParams(location.search).get('pedido'), 10);
  const cont = document.getElementById('contenido');
  const volver = '/login.html?volver=' + encodeURIComponent(location.pathname + location.search);
  if (!id) { cont.innerHTML = '<div class="alert alert-warning">Falta el número de pedido.</div>'; return; }
  if (!leerSesion()) { location.href = volver; return; }

  const { codigo, datos } = await api('GET', '/api/pedidos/' + id);
  if (codigo === 401) { location.href = volver; return; }
  if (codigo === 403) { cont.innerHTML = '<div class="alert alert-danger">Este pedido pertenece a otra cuenta.</div>'; return; }
  if (codigo !== 200) { cont.innerHTML = `<div class="alert alert-warning">${esc(datos?.error || 'No se pudo cargar el pedido.')}</div>`; return; }

  const p = datos.pedido;
  const posicion = ESTADOS.indexOf(p.estado);
  cont.innerHTML = `
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h4 mb-0">Pedido #${p.id}</h1>
      <span>${etiquetaEstado(p.estado)} <span class="text-muted small ms-2">${fechaLocal(p.fecha)}</span></span>
    </div>
    <div class="card border-0 shadow-sm mb-3"><div class="card-body">
      <div class="pasos">
        ${ESTADOS.map((e, i) => `<div class="paso ${i <= posicion ? 'hecho' : ''}">
            <div class="punto"><i class="bi bi-${ICONOS[e]}"></i></div>${e}</div>`).join('')}
      </div>
    </div></div>
    <div class="row g-3">
      <div class="col-md-8"><div class="card border-0 shadow-sm h-100"><div class="card-body">
        <h2 class="h6">Productos</h2>
        <table class="table table-sm mb-2">
          ${p.detalle.map(d => `<tr><td>${esc(d.nombre_producto)} × ${d.cantidad}</td><td class="text-end">${moneda(d.subtotal)}</td></tr>`).join('')}
          <tr class="fw-bold"><td>Total</td><td class="text-end">${moneda(p.total)}</td></tr>
        </table>
        ${p.direccion ? `<p class="small text-muted mb-0"><i class="bi bi-geo-alt"></i> ${esc(p.direccion.direccion)}, ${esc(p.direccion.ciudad)}</p>` : ''}
      </div></div></div>
      <div class="col-md-4"><div class="card border-0 shadow-sm h-100"><div class="card-body text-center">
        ${p.qr_url
          ? `<img src="${esc(p.qr_url)}" width="160" height="160" alt="QR de seguimiento"><p class="small text-muted mt-2 mb-0">QR de seguimiento (api.qrserver.com)</p>`
          : '<p class="small text-muted">El código QR aparece cuando el pedido está pagado.</p>'}
      </div></div></div>
    </div>`;
});
</script>
</body>
</html>
