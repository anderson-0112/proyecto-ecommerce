<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodoTec — Ingresar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/nodotec.css" rel="stylesheet">
</head>
<body>
<header id="cabecera"></header>

<main class="container py-5" style="max-width: 480px">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <ul class="nav nav-pills nav-fill mb-4" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#formIngresar" type="button">Ingresar</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#formRegistro" type="button">Crear cuenta</button></li>
      </ul>
      <div class="tab-content">
        <form id="formIngresar" class="tab-pane fade show active">
          <div class="mb-3"><label class="form-label" for="email">Correo</label>
            <input id="email" type="email" class="form-control" required autocomplete="email"></div>
          <div class="mb-3"><label class="form-label" for="password">Contraseña</label>
            <input id="password" type="password" class="form-control" required autocomplete="current-password"></div>
          <button class="btn btn-nodotec w-100">Ingresar</button>
        </form>
        <form id="formRegistro" class="tab-pane fade">
          <div class="mb-3"><label class="form-label" for="regNombre">Nombre</label>
            <input id="regNombre" class="form-control" required minlength="2" maxlength="100" autocomplete="name"></div>
          <div class="mb-3"><label class="form-label" for="regEmail">Correo</label>
            <input id="regEmail" type="email" class="form-control" required autocomplete="email"></div>
          <div class="mb-3"><label class="form-label" for="regPassword">Contraseña (mínimo 8 caracteres)</label>
            <input id="regPassword" type="password" class="form-control" required minlength="8" autocomplete="new-password"></div>
          <button class="btn btn-nodotec w-100">Crear cuenta</button>
        </form>
      </div>
      <div id="mensaje" class="mt-3"></div>
    </div>
  </div>
</main>

<footer id="pie"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
// A dónde volver después de ingresar (p. ej. ?volver=/checkout.html)
const volver = new URLSearchParams(location.search).get('volver');
const destinoSeguro = (d) => (d && d.startsWith('/') && !d.startsWith('//')) ? d : null;

function mostrarMensaje(texto, tipo) {
  document.getElementById('mensaje').innerHTML = `<div class="alert alert-${tipo} py-2 mb-0">${esc(texto)}</div>`;
}

async function ingresar(email, password) {
  const { codigo, datos } = await api('POST', '/api/auth/login', { email, password });
  if (codigo !== 200) { mostrarMensaje(datos?.error || 'No se pudo ingresar', 'danger'); return; }
  guardarSesion(datos); // { token, expira_en, usuario }
  location.href = destinoSeguro(volver) || (datos.usuario.rol === 'admin' ? '/admin/' : '/');
}

document.getElementById('formIngresar').addEventListener('submit', (e) => {
  e.preventDefault();
  ingresar(document.getElementById('email').value, document.getElementById('password').value);
});

document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  const { codigo, datos } = await api('POST', '/api/auth/register', {
    nombre: document.getElementById('regNombre').value, email, password,
  });
  if (codigo !== 201) {
    const detalle = datos?.campos ? ': ' + Object.values(datos.campos).join(', ') : '';
    mostrarMensaje((datos?.error || 'No se pudo registrar') + detalle, 'danger');
    return;
  }
  await ingresar(email, password); // inicia sesión automáticamente
});
</script>
</body>
</html>
