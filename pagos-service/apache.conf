<VirtualHost *:8084>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        # Toda ruta que no sea un archivo real la atiende index.php (enrutador)
        FallbackResource /index.php
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
